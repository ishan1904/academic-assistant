<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendation Letter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eef2f3, #8e9eab);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 70%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 90%;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .recommendation {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border: 1px solid #ccc;
            max-height: 400px;
            overflow-y: auto;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .button-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }
        .btn {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Recommendation Letter</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <div class="recommendation">
            {{ recommendation | safe }}
        </div>
        <div class="button-container">
            {% if lor_filename %}
                <a href="{{ url_for('download_recommendation', filename=lor_filename) }}" class="btn">
                    Download Recommendation
                </a>
            {% endif %}
            <a href="{{ url_for('dashboard') }}" class="btn">
                Back to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
